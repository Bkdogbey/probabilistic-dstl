[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilistic-dstl"
version = "0.1.0"
description = "Probability-bound Signal Temporal Logic: hard Frechet semantics and a differentiable smooth surrogate, built on torch.nn."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
