# IROS draft scenario: the sine path past three boxes (irobot a2e4fc0).
# Metres, seconds, m/s; world frame (Lighthouse). Box sizes are the IROS
# ones; place the boxes here, measure them, then set measured: true.
measured: false
radio_uri: radio://0/85/2M/E7E7E7E85

altitude_tolerance: 0.20  # mission limit on the 0.25 s mean height
airframe_radius: 0.07  # obstacles grow and walls move in by this
workspace: {x: [-1.0, 1.0], y: [-2.0, 0.85]}
obstacles:  # IROS sizes, all taller than the flight height
  - {name: obs_1, x: [-0.165, 0.165], y: [-1.144, -0.941]}
  # IROS had x [-0.432, -0.102]; the sine curve cut 3.9 cm into it.
  # Moved 0.255 m left: 2.6 cm clearance, as the figure-8 has (2.5 cm).
  - {name: obs_2, x: [-0.687, -0.357], y: [-0.179, 0.049]}
  - {name: obs_3, x: [0.114, 0.343], y: [-0.611, -0.421]}
goal: {x: [-0.30, 0.30], y: [0.10, 0.30]}  # the IROS planner's goal

# The reference curve owns the start, altitude and timing.
reference: plans/iros_sine.json
v_max: 0.30  # speed norm limit on the curve [m/s]
a_max: 0.30  # acceleration norm limit on the curve [m/s^2]
clearance_margin: 0.01  # sampled airframe clearance must stay above this [m]
model_report: null  # set to the report printed by `python run.py --config config.iros.yml fit`

# Set the physical fan manually; this setting labels the flight.
fan: "off"  # "off" (baseline), low, medium, high; quoted: YAML reads off as false
