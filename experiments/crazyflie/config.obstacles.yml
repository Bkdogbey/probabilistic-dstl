# Obstacle arena: flies plans/obstacles.json. Use with --config config.obstacles.yml.
# Enter actual measurements before setting measured: true.
measured: false
radio_uri: radio://0/85/2M/E7E7E7E85

altitude_tolerance: 0.20  # mission limit on the 0.25 s mean height
airframe_radius: 0.07
workspace: {x: [-0.5, 1.5], y: [-2.3, 0.5]}
obstacles:
  - {name: obs_1, x: [0.5, 0.8175], y: [-1.38335, -1.11665], height: 0.4064}
  - {name: obs_2, x: [0.1547, 0.3453], y: [-0.6651, -0.5], height: 0.5143}
  - {name: obs_3, x: [0.7508, 1.0429], y: [-0.8128, -0.6096], height: 0.4191}
goal: {x: [0.85, 1.15], y: [-0.15, 0.15]}

# The reference curve owns the start, altitude and timing.
reference: plans/obstacles.json
v_max: 0.30  # speed norm limit on the curve [m/s]
a_max: 0.30  # acceleration norm limit on the curve [m/s^2]
clearance_margin: 0.01  # sampled airframe clearance must stay above this [m]
model_report: null  # set to the report printed by `python run.py fit`

# Set the physical fan manually; this setting labels the flight.
fan: 0  # 0 = off; active settings: 6, 12, 18

# Routine defaults, including the 5 cm start-height tolerance, are in config.py.
# Override only what is needed, e.g. flight: {start_speed: 0.10}.
