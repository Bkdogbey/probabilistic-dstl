# Crazyflie ring-course experiment. Every stage (plan, fly, analyze) reads
# this file; each plan stores a signature of the parts it depends on and
# each run saves a full copy next to its logs. Units: metres, seconds.
# Arena, radio and flight values follow the experiments/RA-L branch.
name: ring_course

radio:
  uri: radio://0/85/2M/E7E7E7E85

# Reference generation (planners.py). Both planners fly the same task:
# start -> (rings, in order, if enabled) -> goal at a constant height,
# avoiding enabled obstacles. `method` picks the planner; `run.py ...
# --method` overrides it for one command.
planning:
  method: s_path          # s_path (deterministic) | pdstl
  start: [1.0, -2.0]      # RA-L start mark
  goal: [1.0, 0.0]        # RA-L end mark
  height: 0.5
  # S around the start->goal line: lateral offset amplitude*sin(2*pi*s),
  # flown at constant speed, sampled every dt.
  s_path:
    amplitude: 0.3
    speed: 0.30
    dt: 0.1
  # pdSTL planner from src/ (2D at `height`). The flown path is the planned
  # mean at t_k = k*dt. q_std / x0_var are PLACEHOLDERS until calibrated.
  pdstl:
    dynamics: single_integrator   # single_integrator | double_integrator
    H: 60
    dt: 0.2
    u_max: 0.3                    # per axis; speed <= sqrt(2)*u_max
    q_std: 0.01                   # process noise std per step (m)
    x0_var: 1.0e-4                # initial position variance (m^2)
    goal_half_width: 0.08
    seed: 0
    monte_carlo_samples: 2000     # 0 to skip the check
    planner: {max_iters: 300, lr: 0.05, alpha: 0.9}

# RA-L arena flight volume. The trajectory must lie inside it; the estimate
# may leave it by at most `margin` before the flight is aborted and lands.
bounds:
  x: [-0.5, 1.5]
  y: [-2.0, 0.5]
  z: [0.1, 1.7]
  margin: 0.15

# Physical layout. Each group is only enforced on the trajectory (and, for
# rings, reported in summary.json) when `enabled` is true.
environment:
  # Figure-eight obstacle boxes from RA-L (floor to `height`). Off for the
  # ring course.
  obstacles:
    enabled: false
    clearance: 0.15
    boxes:
      - {name: obs_1, x: [0.73, 0.99], y: [-1.17, -0.86], height: 0.41}
      - {name: obs_2, x: [0.41, 0.60], y: [-0.41, -0.24], height: 0.51}
      - {name: obs_3, x: [0.44, 0.65], y: [-1.76, -1.49], height: 0.41}
      - {name: obs_4, x: [0.03, 0.30], y: [-1.10, -0.79], height: 0.41}
  # Rings to fly through, in order (pdSTL: ordered visit regions).
  # PLACEHOLDERS on the nominal S (s = 0.25, 0.5, 0.75): replace with
  # measured centres/radii, then enable.
  rings:
    enabled: false
    regions:
      - {name: ring_1, center: [1.3, -1.5, 0.5], radius: 0.15}
      - {name: ring_2, center: [1.0, -1.0, 0.5], radius: 0.15}
      - {name: ring_3, center: [0.7, -0.5, 0.5], radius: 0.15}

flight:
  connect_timeout_s: 10.0
  takeoff_speed: 0.3
  transit_speed: 0.3
  land_speed: 0.15
  # Placed within home_tolerance (xy) of the start: take off straight to
  # the start height. Otherwise climb to transit_z and cross over.
  home_tolerance: 0.08
  transit_z: 0.65
  stream_hz: 20
  # A streamed command later than this aborts the trajectory and lands
  # (no catch-up burst). Two stream periods.
  max_lateness_s: 0.1
  start_tolerance: 0.03
  start_timeout_s: 15.0
  settle_s: 1.0
  hold_end_s: 1.0
  max_speed: 0.44

# Preflight: reset the Kalman filter, then require the last `window`
# position samples (10 Hz) to spread less than `spread_limit` per axis.
positioning:
  reset_wait_s: 2.0
  window: 10
  spread_limit: 0.08
  timeout_s: 12.0

# Experiment-owned log blocks (telemetry.py), one row per device packet:
# state = x, y, vx, vy, ctrltarget.x, ctrltarget.y; alt = z, vz,
# ctrltarget.z, vbat. Safety decisions need both blocks fresher than
# stale_s; rows go through a bounded queue to one writer thread.
telemetry:
  period_ms: 50           # both blocks, 20 Hz; multiple of 10 ms
  stale_s: 0.3
  queue_size: 20000

logging:
  dir: logs               # one folder per flight attempt
  plans_dir: plans        # plans/<name>/<method>/, reused while in sync
