# Arc scenario: the irobot spline_waypoint sine arc around box 4.
# Metres, seconds, m/s; world frame (Lighthouse). The workspace is wider
# than the figure-8 arena; it must stay inside the net.
measured: false
radio_uri: radio://0/87/2M/E7E7E7E787

altitude_tolerance: 0.20  # mission limit on the 0.25 s mean height
airframe_radius: 0.07  # obstacles grow and walls move in by this
workspace: {x: [-0.5, 1.5], y: [-2.5, 0.5]}
obstacles:  # measured boxes, all taller than the flight height; 1 and 3 to come
  - {name: obs_4, x: [0.46, 0.60], y: [-1.59, -1.30], height: 0.31}
goal: {x: [0.54, 0.84], y: [-0.37, -0.07]}  # around the arc's end

# The reference curve owns the start, altitude and timing.
reference: plans/arc.json
v_max: 0.30  # speed norm limit on the curve [m/s]
a_max: 0.30  # acceleration norm limit on the curve [m/s^2]
clearance_margin: 0.01  # sampled airframe clearance must stay above this [m]
model_report: null  # set to the report printed by `python run.py --config config.arc.yml fit`

# Set the physical fan manually; this setting labels the flight.
fan: "off"  # "off" (baseline), low, medium, high; quoted: YAML reads off as false

# After the curve, climb above the boxes, fly back over the start, land there.
flight: {return_height: 0.5}
