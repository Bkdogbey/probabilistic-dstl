# Crazyflie experiment inputs. Distances are metres and times are seconds.

arena:
  flight_x_bounds: [-0.5, 1.5]
  flight_y_bounds: [-2.0, 0.5]
  flight_z_bounds: [0.1, 1.7]
  z_height: 0.2
  start_xy: [1.0, -2.0]
  end_xy: [1.0, 0.0]
  start_tolerance: 0.08
  safe_path_flight_points: 30
  safe_path_via_points:
    - [0.25, -1.0]
    - [0.617, -0.58]
  obstacles:
    - name: obs_1
      x: [0.5, 0.8175]
      y: [-1.38335, -1.11665]
      height: 0.4064
    - name: obs_2
      x: [0.1547, 0.3453]
      y: [-0.6651, -0.5]
      height: 0.5143
    - name: obs_3
      x: [0.7508, 1.0429]
      y: [-0.8128, -0.6096]
      height: 0.4191
  goal:
    x: [0.85, 1.15]
    y: [-0.15, 0.15]
    z: [0.05, 0.35]

deterministic_path:
  via_points:
    - [0.0, -1.0]
    - [0.5, -0.5]

uncertainty:
  model: first_order_response_stationary_residual_per_fan
  initial_variance: 0.0
  # The pilot shows a repeatable horizontal controller lag. These provisional
  # time constants [s] make the planner predict the actual mean path instead
  # of treating that lag as random covariance. The vertical response is kept
  # instantaneous (0.0) because the pilot does not support the same lag model
  # on z. A final accepted report must replace the enabled-axis values.
  response_enabled_axes: [true, true, false]
  response_time_constant: [0.56, 0.53, 0.0]
  # Provisional stationary diagonal XYZ residual variances [m^2]. Replace only
  # from an accepted final response-aware calibration report.
  stationary_residual_variance_per_fan:
    2: [0.001, 0.001, 0.001]
    6: [0.006, 0.006, 0.006]
    12: [0.020, 0.020, 0.020]
    16: [0.050, 0.050, 0.050]
  # Constant XYZ mean left after the response prediction [m]. The final report
  # estimates it separately so residual bias is not mislabeled as covariance.
  residual_mean_per_fan:
    2: [0.0, 0.0, 0.0]
    6: [0.0, 0.0, 0.0]
    12: [0.0, 0.0, 0.0]
    16: [0.0, 0.0, 0.0]
  source_report: null     # Set after reviewing an offline covariance report.

calibration:
  active_campaign: pilot  # Change to final only after obstacle positions are frozen.
  pilot_runs: 5
  final_runs_per_fan: 20
  bootstrap_samples: 1000
  bootstrap_seed: 20260730
  stationarity_bin_size: 10
  max_stationarity_ratio: 2.0
  response_time_constant_bounds: [0.05, 2.0]
  minimum_response_r_squared: 0.50
  minimum_valid_bootstrap_fraction: 0.95
  plausible_position_margin: 0.50

planner:
  T: 10
  dt: 0.693
  u_max: 0.44
  alpha: 0.90
  config:
    w_phi: 50.0
    w_u: 0.1
    w_dist: 5.0
    w_obs: 5.0
    w_visit: 1.0
    obs_margin: 0.15
    w_du: 2.0
    stl_smoothing_scale: 50.0
    lr: 0.03
    max_iters: 1500
    min_iters: 300
    converge_patience: 300
    infeasible_stall_patience: 200
    probability_improvement_tol: 1.0e-4
    loss_tol: 1.0e-4

flight:
  drone_uri: 'radio://0/85/2M/E7E7E7E85'
  takeoff_velocity: 0.3
  landing_velocity: 0.15
  landing_settle_seconds: 1.0
  log_sample_hz: 10
  arming_wait_seconds: 1.0
  start_position_tolerance: 0.03
  start_position_timeout: 15.0
  start_settle_seconds: 1.0
  return_z: 0.65
  land_z: 0.1
  estimator:
    sample_period_ms: 100
    sample_count: 10
    spread_limit: 0.08
    settle_timeout: 12.0
    reset_wait_seconds: 2.0
    min_base_stations: 1

figure8:
  trajectory_version: 1  # Bump whenever the analytical waypoint formula changes.
  workspace:
    x: [-0.5, 1.0]
    y: [-2.0, 0.5]
    z: [0.20, 0.70]
  chance_workspace:
    x: [-0.5, 1.0]
    y: [-2.25, 0.5]
    z: [0.00, 0.70]
  path:
    center_x: 0.50
    center_y: -1.00
    half_width: 0.25
    vertical_half: 1.00
    base_height: 0.20
    crossing_height: 0.275
    top_height: 0.60
  deterministic_cruise_velocity: 0.30
  return_tolerance: 0.08
  T: 50
  flight_points: 100
  plot_points: 1000
  planner_extra:
    w_phi: 100.0
    w_ref_xy: 20.0
    w_ref_z: 20.0
    w_terminal: 100.0
    w_corridor: 100.0
    corridor_radius: 0.12
    max_control_delta: 0.12
  obstacles:
    - {name: obs_1, x: [0.73, 0.99], y: [-1.17, -0.86], height: 0.41}
    - {name: obs_2, x: [0.41, 0.60], y: [-0.41, -0.24], height: 0.51}
    - {name: obs_3, x: [0.44, 0.65], y: [-1.76, -1.49], height: 0.41}
    - {name: obs_4, x: [0.03, 0.30], y: [-1.10, -0.79], height: 0.41}
    #- {name: obs_5, x: [0.44, 0.64], y: [-1.17, -0.84], height: 0.165}
