# Plot windows when an experiment finishes.
show_plots: true

# Which examples run is chosen in src/main.py (skip_run flags), not here.
experiments:
  offline_temporal:
    always:
      threshold: 50.0
      interval: [0, 1]
    eventually:
      threshold: 55.0
      interval: [0, 1]

  streaming:
    interval: [0, 2]
    animate: true
    frame_interval_ms: 900
    repeat: true

  until:
    interval: [1, 2]
