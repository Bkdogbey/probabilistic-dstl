# Single-shot reach-and-avoid scenario.
# The Environment turns this geometry into
#
#   Always[1, H](OutsideRectangle(obstacle))  and  Eventually[1, H](InsideRectangle(goal))
#
# whose events are evaluated by the predicted Gaussian beliefs
# b_k = N(mu_k(u), Sigma_k) of the SingleIntegrator. The planner optimises the
# lower pdSTL robustness of that belief trajectory; the mean is only plotted.

# --- Dynamics ---
dynamics: single_integrator
H: 80            # Planning horizon (time steps)
dt: 0.2          # Time step [s]
u_max: 1.0       # Maximum control magnitude per axis [m/s]
q_std: 0.03      # Process noise standard deviation

# --- Initial belief ---
x0_mean: [0.0, 5.0]
x0_cov_scale: 0.01   # Diagonal covariance initialised as I * x0_cov_scale

# --- Environment ---
goal:
  x_range: [10.0, 12.0]
  y_range: [2.0, 4.0]

# The straight line from the start toward the goal cuts this obstacle's
# lower-left corner. If that line crossed the obstacle's middle instead, every
# safety probability along it would be ~0, so the conjunction's lower bound
# max(0, S + G - 1) would be exactly 0 with no gradient to follow.
obstacles:
  - type: rectangle
    x_range: [4.0, 7.0]
    y_range: [3.8, 8.0]

# Initial control guess, repeated every step: a straight line toward the goal.
# It is only a numerical starting point (initialization != objective).
init_control: [0.7, -0.125]

# --- Planner overrides (merged on top of configs/planning.yaml defaults) ---
# Shaping heuristics are off: only pdSTL robustness and control regularisation
# enter the objective. The formula is evaluated directly (scale <= 0).
planner:
  w_phi: 10.0
  w_u: 0.01
  w_du: 0.01
  w_dist: 0.0
  w_obs: 0.0
  w_visit: 0.0
  scale: -1
  lr: 0.05
  max_iters: 300

# --- Output ---
ellipse_every: 10    # Covariance ellipse every N predicted steps
save_file: reach_avoid.pt
figure: reach_avoid.png
