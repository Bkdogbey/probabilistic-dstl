# Configurable single-shot stochastic reach-avoid proof of concept.
scenario:
  type: reach_avoid
  name: Asymmetric Reach–Avoid

dynamics: single_integrator
H: 40
dt: 0.2
u_max: 1.0
q_std: 0.02

x0_mean: [-3.0, 0.0]
x0_cov_scale: 0.01

workspace:
  name: workspace
  x: [-4.5, 5.0]
  y: [-2.5, 2.5]
  style: {color: 'tab:gray'}

goal:
  name: goal
  x: [3.0, 4.0]
  y: [-0.5, 0.5]
  style: {color: 'tab:green'}

obstacles:
  - name: obstacle
    x: [-1.0, 1.0]
    y: [-1.0, 1.0]
    style: {color: 'tab:red', hatch: '//'}

goal_interval: [30, 40]

planner:
  w_phi: 100.0
  w_u: 0.5
  w_du: 0.01
  lr: 0.05
  max_iters: 1000
  alpha: 0.90
  converge_patience: 3

visualization:
  ellipse_every: 6
  animation_fps: 6
