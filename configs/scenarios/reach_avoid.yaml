# Reach-and-avoid planning scenario.
# One rectangular goal G and one rectangular obstacle O, specified as
#
#   Always[1, H](outside O)  and  Eventually[1, H](inside G)
#
# with every rectangle built from x/y threshold atoms (planning/specifications.py).
# Probabilities come only from GaussianBelief.probability_bounds; the robot's
# future beliefs are predicted by SingleIntegrator through gaussian_rollout.

# --- Dynamics ---
dynamics: single_integrator
H: 30            # Planning horizon (time steps)
dt: 0.2          # Time step [s]
u_max: 1.0       # Maximum control magnitude [m/s]
q_std: 0.05      # Process noise standard deviation

# --- Initial condition ---
x0_mean: [0.0, 0.0]
x0_cov_scale: 0.02   # Diagonal covariance initialised as I * x0_cov_scale

# --- Environment ---
goal:
  x_range: [4.0, 5.0]
  y_range: [-2.0, 2.0]

obstacle:
  x_range: [1.5, 2.8]
  y_range: [-0.25, 1.0]

# Initial control guess, repeated for every step. It drives the mean along
# y = 0 into the goal, straight through the obstacle, so the initial plan
# reaches but does not avoid. This tests reach-and-avoid semantics, not global
# initialisation from a flat region.
init_control: [0.8, 0.0]

# --- Planner overrides (merged on top of configs/planning.yaml defaults) ---
# Shaping heuristics are off: only the pdSTL term and control regularisation
# shape the objective. The formula is evaluated directly (scale <= 0).
# Expect the hard lower bound to saturate near 0.9: by the time the mean can
# reach the goal, sigma ~ 0.3 against a goal only 1.0 wide, which caps the
# Frechet lower bound of the four goal atoms.
planner:
  w_phi: 10.0
  w_u: 0.01
  w_du: 0.01
  w_dist: 0.0
  w_obs: 0.0
  w_visit: 0.0
  scale: -1
  lr: 0.05
  max_iters: 300

# --- Output ---
ellipse_steps: [0, 8, 15, 22, 30]
save_file: reach_avoid.pt
figure: reach_avoid.png
animation:
  filename: reach_avoid_animation.gif
  step: 1
  title: "Reach-Avoid Planning"
  bounds: [[-1, 6], [-3, 3]]
