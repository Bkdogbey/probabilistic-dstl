# 2D inspection: inspect P1 (through the slot) or P2 (over the rack top),
# then checkpoint C, then destination D. Specs R1-R3; see
# src/experiments/inspection_2d.py. Units are metres and steps.
name: 2D inspection
dynamics: double_integrator
H: 75
dt: 0.2
u_max: 1.0
dwell: 10       # steps inside P1 or P2 (2 s)
deadline: 75    # T_d for reaching D
x0_mean: [1.0, 1.0, 0.0, 0.0]
x0_cov_scale: [1.0e-4, 1.0e-4, 0.0, 0.0]  # sigma = 1 cm
q_std: null     # set from `noise` once the levels are chosen
noise: {low: null, medium: null, high: null}
noise_candidates: [0.001, 0.002, 0.005, 0.01]
# Near-zero noise for the feasibility check. At q_std 1e-4 / variance 1e-8
# the pdSTL gradient has NaN entries (Gaussian tail in float32).
nominal: {q_std: 3.0e-4, x0_cov_scale: [1.0e-7, 1.0e-7, 0.0, 0.0]}

bounds: {x_range: [0, 10], y_range: [0, 10]}
obstacles:
  - {name: rack lower, x_range: [3.5, 4.5], y_range: [0.0, 1.2]}
  - {name: rack upper, x_range: [3.5, 4.5], y_range: [1.8, 6.0]}
regions:
  P1: {x_range: [5.5, 6.5], y_range: [0.8, 2.2]}
  P2: {x_range: [2.4, 3.4], y_range: [6.6, 7.6]}
  C: {x_range: [7.5, 8.7], y_range: [4.0, 5.2]}
  D: {x_range: [8.0, 9.2], y_range: [8.0, 9.2]}

route: {clearance: 0.05, resolution: 0.05}
seeds: {hold: 12, arrival: 1.0}  # steps at rest in P1/P2; D centre at arrival*H
routes:
  slot: {stops: [[4.0, 1.5], P1, C, D], narrow: [4.0, 1.5]}
  top: {stops: [P2, C, D], narrow: [4.0, 6.1]}
  over_rack: {stops: [[4.0, 6.3], P1, C, D], narrow: [4.0, 6.3]}
starts: [slot, top]  # the two seeds every method plans from

# Same limits and max_iters for both; lr is frozen after the R2 pilot.
# STLCG: pdSTL off, an unreachable hinge target keeps the smoothed mean
# robustness always active, and the final iterate is returned.
methods:
  pdstl: {lr: 0.01, max_iters: 300}
  stlcg:
    {lr: 0.01, max_iters: 300, w_phi: 0.0, w_margin: 1.0,
     margin_target: 10.0, margin_beta: 10.0, select_by: last}
lr_grid: [0.001, 0.003, 0.01]  # lr 0.01 drifts the end out of D on step 1
time_limit: 1800  # optimizer seconds per start
log_every: 10     # iterations between convergence-log entries
monte_carlo: {samples: 5000, seed: 2026}  # planning uses no random draws
paper: {ellipse_every: 8}
