# Gate-corridor reach-avoid: a stochastic single integrator must cross a wall of blocks
# through the gap between them and settle inside the goal rectangle.
#
# Every coordinate below is read by the code; nothing is hard-coded in Python. Adding,
# moving, resizing or removing a block is an edit to `environment.obstacles` alone.
#
#   y=10 +--------------------------+
#        |      ### upper ###       |
#    6.0 |      ------------        |   gate: y in [4, 6]
#    4.0 |      ------------        |
#        |      ### lower ###  +-G-+|
#   y=0  +--------------------------+
#        x=0      4    6      8.5 9.5

scenario:
  type: reach_avoid
  name: gate_corridor

controller:
  type: receding_horizon
  max_steps: 40
  apply_steps: 1
  warm_start: true

horizon: 40

dynamics:
  type: single_integrator
  dt: 0.25
  u_max: 1.5
  q_std: 0.08

initial_belief:
  mean: [1.0, 1.0]
  covariance:
    - [0.04, 0.0]
    - [0.0, 0.04]

environment:
  goal_deadline: 40

  bounds:
    x_range: [0.0, 10.0]
    y_range: [0.0, 10.0]

  goal:
    name: goal
    x_range: [8.5, 9.5]
    y_range: [8.5, 9.5]

  obstacles:
    - name: lower_block
      x_range: [4.0, 6.0]
      y_range: [0.0, 4.0]

    - name: upper_block
      x_range: [4.0, 6.0]
      y_range: [6.0, 10.0]

optimizer:
  learning_rate: 0.03
  max_iterations: 500
  probability_target: 0.80
  convergence_patience: 15

  smoothing:
    enabled: true
    beta_start: 1.0
    beta_end: 20.0

  loss:
    pdstl_weight: 1.0
    control_effort_weight: 0.001
    control_smoothness_weight: 0.01
    terminal_goal_weight: 0.0

visualization:
  ellipse_every: 3
  confidence_level: 0.95
  show_initial_plan: true
  show_optimization_history: true

output:
  figure: reach_avoid_receding.png
