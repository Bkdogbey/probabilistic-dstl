# Inspection and dock (Ben's sketch). A 10 m room with a shelf wall; the
# gap between its two shelves is a contaminated shortcut. The robot must
# visit A or B, end at the dock D, and, if it passed the contaminated gap C,
# spend 1 s at the inspection station I before docking:
#
#   phi = G safe & (not D U (A or B)) & G(C -> (not D U G[0,1 s] I)) & F D
#
# The robot follows its plan with a PD tracker, so its uncertainty settles
# at a steady tracking error instead of growing with time (open loop would
# make every late task infeasible over a 15 s mission).
name: Inspection and Dock
dynamics: tracked_double_integrator
tracking: {kp: 2.25, kd: 3.0}   # critically damped, natural freq 1.5 rad/s
H: 75             # 15 s
dt: 0.2
u_max: 1.0
q_std: null       # set per level from `uncertainty`
x0_mean: [0.55, 1.05, 0.0, 0.0]
x0_cov_scale: [1.0e-4, 1.0e-4, 0.0, 0.0]

bounds: {x_range: [0.0, 10.0], y_range: [0.0, 10.0]}
obstacles:
  - {name: shelf_low, x_range: [3.0, 4.2], y_range: [0.0, 3.6]}
  - {name: shelf_high, x_range: [3.0, 4.2], y_range: [4.2, 8.5]}
regions:
  C: {x_range: [3.0, 4.2], y_range: [3.6, 4.2]}    # contaminated gap, 0.6 m
  A: {x_range: [7.85, 8.85], y_range: [2.6, 3.6]}
  B: {x_range: [6.4, 7.4], y_range: [7.1, 8.1]}
  I: {x_range: [5.4, 6.4], y_range: [2.05, 3.05]}  # inspection station
  D: {x_range: [8.7, 10.0], y_range: [5.2, 6.0]}   # dock
times:            # seconds; converted to steps with dt
  inspect_s: 1.0  # stay at I this long
  within_s: 6.0   # after contamination, finish inspecting within this
  rule_s: 8.0     # the rule watches for contamination during [0, rule_s]

# Uncertainty levels: the robot's steady 1-sigma tracking error; the process
# noise q (Q = q^2 I) for each is computed in inspection_dock.load.
uncertainty:
  tracking_std_m: {low: 0.05, medium: 0.10, high: 0.20}

routes:           # one start per plan: legs of (waypoints, dwell seconds)
  shortcut:
    - [[[2.2, 3.4], [3.0, 3.9], [4.2, 3.9], [5.2, 3.2], [5.9, 2.55]], 1.0]
    - [[[8.35, 3.1], [8.9, 4.4], [9.3, 5.6]], 0.0]
  detour:
    - [[[1.2, 5.0], [1.8, 8.0], [2.8, 9.3], [4.4, 9.3], [6.9, 7.6],
        [8.6, 6.6], [9.3, 5.6]], 0.0]

methods:
  # STLCG: hard requirement on the mean path (margin_target, metres).
  stlcg:
    kind: stlcg
    planner: {w_phi: 0.0, w_margin: 100.0, margin_target: 0.05,
              margin_beta: 10.0, w_u: 0.05, w_du: 1.0e-3,
              max_iters: 600, lr: 0.01, select_by: last}
  # pdSTL: requirement on the exact score (score_threshold).
  pdstl:
    kind: pdstl
    planner: {w_phi: 100.0, score_threshold: 0.99, w_u: 0.05, w_du: 1.0e-3,
              max_iters: 600, lr: 0.01, select_by: pdstl}

monte_carlo: {samples: 5000, seed: 7}
figure: {ellipse_every: 5}   # one 95% ellipse per second
