# Reach-avoid (stlpy NarrowPassage): reach goal A or B past four obstacles.
name: Narrow Passage
dynamics: double_integrator
H: 40
dt: 0.2
u_max: 1.0
q_std: 0.002
x0_mean: [3.0, 3.6, 0.0, 0.0]
x0_cov_scale: [0.005, 0.005, 0.0, 0.0]

bounds: {x_range: [0, 12], y_range: [0, 12]}
obstacles:
  - {name: centre, x_range: [2.0, 5.0], y_range: [4.0, 6.0]}
  - {name: middle, x_range: [5.5, 9.0], y_range: [3.8, 5.7]}
  - {name: lower, x_range: [4.6, 8.0], y_range: [0.5, 3.5]}
  - {name: upper, x_range: [2.2, 4.4], y_range: [6.4, 11.0]}
goal:
  any_of:
    - {name: A, x_range: [7, 8], y_range: [8, 9]}
    - {name: B, x_range: [9.5, 10.5], y_range: [1.5, 2.5]}

route: {clearance: 0.05, resolution: 0.05}
planner: {max_iters: 300, lr: 0.01, alpha: 0.9}
visualization: {ellipse_every: 10, animation_fps: 10}
