# Reach-avoid: go around one obstacle to the goal.
name: Reach–Avoid
dynamics: single_integrator
H: 40
dt: 0.2
u_max: 1.0
q_std: 0.02
x0_mean: [-3.0, 0.0]
x0_cov_scale: 0.01

bounds: {x_range: [-4.5, 5.0], y_range: [-2.5, 2.5]}
obstacles:
  - {x_range: [-1.0, 1.0], y_range: [-2.0, 1.5]}
goal: {x_range: [3.0, 4.0], y_range: [-0.5, 0.5]}

route: {clearance: 0.05, resolution: 0.05}
planner: {alpha: 0.9}
visualization: {ellipse_every: 4, animation_fps: 6}
