# Slit or around (Ben's sketch): a 10 m room with a floor block and a taller
# upper block. Between them is a narrow slit (0.3 m), the short way to the
# goal; above the upper block the room is open, a longer way around. The task
# is phi = G[0,H] (inside the room and outside both blocks) & F[0,H] goal.
# Both methods plan "meet the requirement, then spend least effort";
# src/experiments/two_gap.py compares them at three noise levels.
name: Slit or Around
dynamics: double_integrator
H: 60
dt: 0.2
u_max: 1.0
q_std: null       # set per noise level from `noise`
x0_mean: [0.5, 4.0, 0.0, 0.0]
x0_cov_scale: [1.0e-4, 1.0e-4, 0.0, 0.0]
bounds: {x_range: [0.0, 10.0], y_range: [0.0, 10.0]}
obstacles:
  - {name: floor, x_range: [4.0, 5.5], y_range: [0.0, 3.0]}
  - {name: upper, x_range: [4.0, 5.5], y_range: [3.3, 6.5]}
goal: {x_range: [8.3, 9.3], y_range: [4.5, 5.5]}

noise: {low: 0.001, medium: 0.005, high: 0.01}   # q_std per level
gaps:  # one start per route: waypoints after the start, ending at the goal
  slit: [[3.4, 3.15], [6.1, 3.15], [8.8, 5.0]]
  around: [[3.4, 7.5], [6.1, 7.5], [8.8, 5.0]]

methods:
  # STLCG: hard requirement on the mean path (margin_target, metres).
  stlcg:
    kind: stlcg
    planner: {w_phi: 0.0, w_margin: 100.0, margin_target: 0.05,
              margin_beta: 10.0, w_u: 0.05, w_du: 1.0e-3,
              max_iters: 600, lr: 0.01, select_by: last}
  # pdSTL: requirement on the exact score (score_threshold).
  pdstl:
    kind: pdstl
    planner: {w_phi: 100.0, score_threshold: 0.95, w_u: 0.05, w_du: 1.0e-3,
              max_iters: 600, lr: 0.01, select_by: pdstl}

monte_carlo: {samples: 5000, seed: 7}
figure: {ellipse_every: 5}   # one 95% ellipse per second
