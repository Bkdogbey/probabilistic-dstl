# Two-gap reach-avoid: three blocks leave a narrow gap (0.7 m) level with
# the start and goal, and a wide gap (1.5 m) that needs a detour. The task is
# phi = G[0,H] (inside bounds and outside every block) & F[0,H] goal.
# Both methods plan "meet the requirement, then spend least effort";
# src/experiments/two_gap.py compares them at three noise levels.
name: Two-Gap
dynamics: double_integrator
H: 100
dt: 0.2
u_max: 1.0
q_std: null       # set per noise level from `noise`
x0_mean: [0.5, 6.45, 0.0, 0.0]
x0_cov_scale: [1.0e-4, 1.0e-4, 0.0, 0.0]
bounds: {x_range: [0.0, 15.0], y_range: [0.0, 10.0]}
obstacles:
  - {name: low, x_range: [7.0, 8.5], y_range: [0.0, 3.2]}
  - {name: mid, x_range: [7.0, 8.5], y_range: [4.7, 6.1]}
  - {name: top, x_range: [7.0, 8.5], y_range: [6.8, 10.0]}
goal: {x_range: [11.75, 14.25], y_range: [5.2, 7.7]}  # 2.5 m loading area

noise: {low: 0.003, medium: 0.006, high: 0.012}   # q_std per level (doubling)
gaps:  # one start per gap: waypoints after the start, ending at the goal
  narrow: [[6.2, 6.45], [9.3, 6.45], [13.0, 6.45]]
  wide: [[6.2, 3.95], [9.3, 3.95], [13.0, 6.45]]

methods:
  # STLCG: hard requirement on the mean path (margin_target, metres).
  stlcg:
    kind: stlcg
    planner: {w_phi: 0.0, w_margin: 100.0, margin_target: 0.05,
              margin_beta: 10.0, w_u: 0.05, w_du: 1.0e-3,
              max_iters: 600, lr: 0.01, select_by: last}
  # pdSTL: requirement on the exact score (score_threshold).
  pdstl:
    kind: pdstl
    planner: {w_phi: 100.0, score_threshold: 0.95, w_u: 0.05, w_du: 1.0e-3,
              max_iters: 600, lr: 0.01, select_by: pdstl}
  # Supplement: STLCG with a large fixed margin.
  stlcg_m30:
    kind: stlcg
    planner: {w_phi: 0.0, w_margin: 100.0, margin_target: 0.30,
              margin_beta: 10.0, w_u: 0.05, w_du: 1.0e-3,
              max_iters: 600, lr: 0.01, select_by: last}

monte_carlo: {samples: 5000, seed: 7}
figure: {ellipse_every: 10}
