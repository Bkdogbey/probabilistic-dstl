# Optimizer defaults; a scenario's `planner:` block overrides them.
w_phi: 1.0
w_u: 1.0e-3
w_du: 1.0e-3
w_margin: 0.0  # optional deterministic STL hinge; zero preserves pdSTL-only planning
margin_target: 0.0
margin_normalization: std  # none: raw mean margins; std: Gaussian z-score margins
margin_sigma_floor: 1.0e-3
margin_beta: null  # null: hard STL robustness; positive: STLCG log-sum-exp smoothing
lr: 0.05
max_iters: 300
smoothing:
  beta_start: 10.0
  beta_end: 200.0
alpha: null      # report whether the selected exact lower bound meets it
