# Small control penalties preserve weak initial smooth-score gradients.
show_plots: true
end_to_end_reach:
  threshold: 1.0
  dim: 0
  H: 10
  dt: 0.2
  u_max: 1.0
  q_std: 0.05
  x0_mean: [0.0, 0.0]
  x0_cov_scale: 0.05
  planner:
    w_phi: 10.0
    w_u: 0.001
    w_du: 0.001
    max_iters: 300
    smoothing:
      beta_start: 20.0
      beta_end: 20.0
end_to_end_mpc_reach:
  threshold: 2.0
  dim: 0
  H: 10
  max_steps: 25
  dt: 0.2
  u_max: 1.0
  q_std: 0.05
  x0_mean: [0.0, 0.0]
  x0_cov_scale: 0.05
  init_control: [0.5, 0.0]
  seed: 0
  planner:
    w_phi: 10.0
    w_u: 1.0e-05
    w_du: 1.0e-05
    max_iters: 300
    smoothing:
      beta_start: 20.0
      beta_end: 20.0
