show_plots: true

# always/eventually/nested each supply an upstream scalar state model:
# (mean, variance) per step, one precise Gaussian belief N(mean, variance). The
# atomic probability p_k = P(X_k >= threshold) is computed from it and enters
# pdSTL as [p_k, p_k]; any mean +- sigma band in the plots is visualization only.

always:
  threshold: 50.0
  interval_steps: [0, 2]
  values:
    - [56.0, 4.0]
    - [54.0, 4.0]
    - [52.0, 4.0]
    - [50.0, 4.0]
    - [48.0, 4.0]
    - [54.0, 4.0]
    - [56.0, 4.0]
    - [58.0, 4.0]

eventually:
  threshold: 50.0
  interval_steps: [0, 1]
  values:
    - [46.0, 4.0]
    - [48.0, 4.0]
    - [50.0, 4.0]
    - [48.0, 4.0]
    - [54.0, 4.0]
    - [46.0, 4.0]
    - [44.0, 4.0]

nested:
  threshold: 50.0
  always_interval_steps: [0, 1]
  eventually_interval_steps: [0, 1]
  values:
    - [48.0, 4.0]
    - [54.0, 4.0]
    - [52.0, 4.0]
    - [48.0, 4.0]
    - [50.0, 4.0]
    - [56.0, 4.0]

# Control optimisation over a propagated descriptor enclosure: a SingleIntegrator
# rolled out with rollout_enclosure(), not a manufactured mean +- sigma band.
# lower0/upper0 (descriptor bounds), covariance0 (residual), and d_lower/d_upper
# (bounded offset) are independent inputs -- none is derived from another.
enclosure_reach:
  threshold: 2.5
  interval_steps: [1, 2]
  H: 8
  dt: 0.5
  u_max: 1.0
  q_std: 0.05
  lower0: [0.0, 0.0]
  upper0: [0.3, 0.3]
  covariance0: [0.09, 0.09]
  d_lower: [-0.02, -0.02]
  d_upper: [0.03, 0.03]
  seed: 0
  planner:
    w_u: 0.0
    w_du: 0.0
    w_dist: 0.0
    w_obs: 0.0
    w_visit: 0.0
    scale: -1

# Minimal end-to-end planning smoke test: a precise Gaussian SingleIntegrator
# rollout, one atomic predicate x >= threshold, and Eventually over [0, H].
# Only the pdSTL term and control regularisation shape the objective.
end_to_end_reach:
  threshold: 1.0
  dim: 0
  H: 10
  dt: 0.2
  u_max: 1.0
  q_std: 0.05
  x0_mean: [0.0, 0.0]
  x0_cov_scale: 0.05
  planner:
    w_phi: 10.0
    w_u: 0.1
    w_du: 0.1
    w_dist: 0.0
    w_obs: 0.0
    w_visit: 0.0
    scale: -1

# Receding-horizon version of end_to_end_reach: at every executed step the
# planner optimises Eventually[0, H](x >= threshold) from the current belief,
# applies only the first control to a simulated system (predicted step plus
# sampled process noise), and replans. A 10-step window reaches at most
# x = 2.0, so the target cannot be met by a single plan.
# init_control seeds the first window only (later windows warm-start from the
# shifted previous plan). It must not be zero: at rest every P(x_k >= 2) is
# below float32's CDF resolution (z ~ -7), so the objective is flat.
end_to_end_mpc_reach:
  threshold: 2.0
  dim: 0
  H: 10
  max_steps: 25
  dt: 0.2
  u_max: 1.0
  q_std: 0.05
  x0_mean: [0.0, 0.0]
  x0_cov_scale: 0.05
  init_control: [0.5, 0.0]
  seed: 0
  planner:
    # Far from the target the pdSTL gradient is ~1e-3; w_u = w_du = 0.1 (the
    # single-shot values) would out-pull it and return the initial guess.
    w_phi: 10.0
    w_u: 0.001
    w_du: 0.001
    w_dist: 0.0
    w_obs: 0.0
    w_visit: 0.0
    scale: -1
