show_plots: true

# End-to-end smoke test: Eventually[0, H](x >= threshold), shaping off.
end_to_end_reach:
  threshold: 1.0
  dim: 0
  H: 10
  dt: 0.2
  u_max: 1.0
  q_std: 0.05
  x0_mean: [0.0, 0.0]
  x0_cov_scale: 0.05
  planner:
    w_phi: 10.0
    w_u: 0.1
    w_du: 0.1
    w_dist: 0.0
    w_obs: 0.0
    w_visit: 0.0
    smoothing:
      enabled: false

# MPC version: one 10-step window cannot reach x = 2, so it must replan.
# init_control must be nonzero: at rest P(x_k >= 2) underflows and the objective is flat.
end_to_end_mpc_reach:
  threshold: 2.0
  dim: 0
  H: 10
  max_steps: 25
  dt: 0.2
  u_max: 1.0
  q_std: 0.05
  x0_mean: [0.0, 0.0]
  x0_cov_scale: 0.05
  init_control: [0.5, 0.0]
  seed: 0
  planner:
    # Far from the target the pdSTL gradient is ~1e-3; w_u = w_du = 0.1 (the
    # single-shot values) would out-pull it and return the initial guess.
    w_phi: 10.0
    w_u: 0.001
    w_du: 0.001
    w_dist: 0.0
    w_obs: 0.0
    w_visit: 0.0
    smoothing:
      enabled: false
