show_plots: true

# Every example supplies an upstream scalar state model: (mean, variance) per
# step. The atomic probability bounds are computed from it, not listed here.

always:
  threshold: 50.0
  sigma_multiplier: 1.0
  interval_steps: [0, 2]
  values:
    - [56.0, 4.0]
    - [54.0, 4.0]
    - [52.0, 4.0]
    - [50.0, 4.0]
    - [48.0, 4.0]
    - [54.0, 4.0]
    - [56.0, 4.0]
    - [58.0, 4.0]

eventually:
  threshold: 50.0
  sigma_multiplier: 1.0
  interval_steps: [0, 1]
  values:
    - [46.0, 4.0]
    - [48.0, 4.0]
    - [50.0, 4.0]
    - [48.0, 4.0]
    - [54.0, 4.0]
    - [46.0, 4.0]
    - [44.0, 4.0]

nested:
  threshold: 50.0
  sigma_multiplier: 1.0
  always_interval_steps: [0, 1]
  eventually_interval_steps: [0, 1]
  values:
    - [48.0, 4.0]
    - [54.0, 4.0]
    - [52.0, 4.0]
    - [48.0, 4.0]
    - [50.0, 4.0]
    - [56.0, 4.0]

# Growing uncertainty at t=4 (variance 9) as well as a changing mean.
piecewise:
  threshold: 50.0
  sigma_multiplier: 1.0
  interval_steps: [0, 1]
  values:
    - [45.0, 4.0]
    - [55.0, 4.0]
    - [60.0, 4.0]
    - [48.0, 4.0]
    - [42.0, 9.0]
    - [58.0, 4.0]
    - [52.0, 4.0]
